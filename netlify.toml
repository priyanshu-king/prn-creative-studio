[build]
  command = "npm run build"
  publish = "dist"

# Required for SPAs (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache optimizations
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"